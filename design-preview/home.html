<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelFrost preview</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0b0b0b; font-family:system-ui, sans-serif; }
  .phone { position:relative; width:360px; height:740px; border-radius:36px; overflow:hidden; background:#1b2238; }
  .blob { position:absolute; border-radius:50%; }
  .glass { background:rgba(255,255,255,0.16); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); border:0.5px solid rgba(255,255,255,0.4); }
  .search { position:absolute; left:16px; right:16px; top:56px; height:44px; border-radius:999px; display:flex; align-items:center; padding:0 16px; color:#C4C6D0; font-size:14px; box-sizing:border-box; }
  .glance { position:absolute; left:16px; right:16px; top:116px; padding:14px 16px; border-radius:24px; color:#F1F3F4; box-sizing:border-box; }
  .grid { position:absolute; left:16px; right:16px; top:270px; display:grid; grid-template-columns:repeat(4,1fr); gap:18px 8px; }
  .app { display:flex; flex-direction:column; align-items:center; gap:6px; color:#F1F3F4; font-size:11px; }
  .icon { width:56px; height:56px; border-radius:18px; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:20px; color:#fff; }
  .dock { position:absolute; left:16px; right:16px; bottom:24px; height:84px; border-radius:28px; display:flex; justify-content:space-around; align-items:center; box-sizing:border-box; }
  .dock .icon { width:52px; height:52px; }
</style>
</head>
<body>
<div class="phone">
  <div class="blob" style="left:-60px;top:80px;width:260px;height:260px;background:#378ADD;opacity:.6"></div>
  <div class="blob" style="right:-70px;top:260px;width:240px;height:240px;background:#7F77DD;opacity:.6"></div>
  <div class="blob" style="left:20px;bottom:120px;width:220px;height:220px;background:#1D9E75;opacity:.5"></div>
  <div class="blob" style="right:-30px;bottom:200px;width:140px;height:140px;background:#D85A30;opacity:.4"></div>

  <div class="search glass">Cari aplikasi, kontak, atau web</div>

  <div class="glance glass">
    <div style="font-size:12px;color:#C4C6D0">Rabu, 25 November</div>
    <div style="font-size:22px;font-weight:500;margin-top:4px">Cerah 27°</div>
  </div>

  <div class="grid">
    <div class="app"><div class="icon" style="background:#185FA5">M</div>Email</div>
    <div class="app"><div class="icon" style="background:#0F6E56">K</div>Kamera</div>
    <div class="app"><div class="icon" style="background:#993C1D">Mu</div>Musik</div>
    <div class="app"><div class="icon" style="background:#3C3489">P</div>Peta</div>
    <div class="app"><div class="icon glass">F</div>Folder</div>
    <div class="app"><div class="icon" style="background:#444441">C</div>Catatan</div>
    <div class="app"><div class="icon" style="background:#085041">Ka</div>Kalender</div>
    <div class="app"><div class="icon" style="background:#633806">Cu</div>Cuaca</div>
  </div>

  <div class="dock glass">
    <div class="icon" style="background:#185FA5">T</div>
    <div class="icon" style="background:#0F6E56">P</div>
    <div class="icon" style="background:#D85A30">W</div>
    <div class="icon" style="background:#7F77DD">S</div>
  </div>
</div>
</body>
</html>
